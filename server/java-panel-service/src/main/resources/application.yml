server:
  port: 5002
  servlet:
    context-path: /api

spring:
  application:
    name: java-panel-service

logging:
  level:
    com.parkingaltea.panelservice: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Configuración de paneles
panel:
  service:
    library:
      jar-path: /opt/parking_altea/panel_java/protocol-1.2.6.jar
      timeout: 5000
      retry-attempts: 3
      retry-delay: 1000
    default:
      port: 5200
      card-id: 1
      window-no: 0
    panels:
      - ip: "172.20.5.50"
        name: "PANEL BASSETA 1"
        description: "P. Basseta Centre"
      - ip: "172.20.5.51"
        name: "PANEL BASSETA 2"
        description: "P. Basseta Centre"
      - ip: "172.20.4.50"
        name: "PANEL PALAU"
        description: "P. Poble antic/Palau Altea"
      - ip: "172.20.4.51"
        name: "PANEL COCOLISO"
        description: "P. Poble antic/Palau Altea"
      - ip: "172.20.4.52"
        name: "BELLES ARTS 2"
        description: "P. Poble antic/Belles Arts 2"
      - ip: "172.20.4.53"
        name: "BELLES ARTS"
        description: "P. Poble antic/Belles Arts 1"
      - ip: "172.20.2.50"
        name: "PANEL RENFE"
        description: "P. Estació Altea"
      - ip: "172.20.1.50"
