---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.parkingaltea.panelservice: DEBUG
    org.springframework.web: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    com.parkingaltea.panelservice: WARN
    org.springframework.web: WARN 